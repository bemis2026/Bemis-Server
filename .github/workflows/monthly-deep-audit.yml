# Monthly SEO + health snapshot.
#
# Runs scripts/seo-snapshot.cjs (sitemap stats + PageSpeed Insights for
# home + catalog on mobile and desktop) and ships the report through
# notify-finding.cjs. No agent — just plain Node, no Anthropic credits.
#
# Deep code audits (a11y, security, full SEO) are best done on-demand
# with `@claude run .claude/agents/<agent>.md` in a GitHub issue, since
# they generate too much context for a scheduled run to summarise well.

name: Monthly SEO snapshot

on:
  schedule:
    - cron: "0 2 1 * *"   # 1st of month, 02:00 UTC = 05:00 Europe/Istanbul
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: PageSpeed + sitemap snapshot
        env:
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:  ${{ secrets.RESEND_FROM_EMAIL }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
        run: |
          node scripts/seo-snapshot.cjs > /tmp/seo.txt
          jq -n \
            --arg title "Aylık SEO durumu — $(date +%Y-%m)" \
            --rawfile body /tmp/seo.txt \
            --arg src "seo-snapshot" \
            '{title: $title, severity: "low", body: $body, source: $src}' \
            | node scripts/notify-finding.cjs
