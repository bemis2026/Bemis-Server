# Weekly production-health summary.
#
# No agent call — just runs scripts/sentry-health.cjs and pipes the
# raw 14-day Sentry digest into notify-finding.cjs. The summary lands
# in a GitHub Issue + email; you can open the linked Sentry issues
# in the report yourself.
#
# (We removed the original Claude agent step because claude-code-action
#  only fires on @claude mentions, not on cron triggers. A plain script
#  is more reliable and uses zero Anthropic credits.)

name: Weekly production-health

on:
  schedule:
    - cron: "0 6 * * 1"   # Mon 06:00 UTC = 09:00 Europe/Istanbul
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Sentry 14-day digest → GitHub + email
        env:
          SENTRY_AUTH_TOKEN:  ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:         ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:     ${{ secrets.SENTRY_PROJECT }}
          SENTRY_REGION:      ${{ secrets.SENTRY_REGION }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:  ${{ secrets.RESEND_FROM_EMAIL }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
        run: |
          set -e
          node scripts/sentry-health.cjs 14d > /tmp/sentry.txt 2>&1 || true
          # Severity heuristic: any 🔴 line → critical, any 🟡 → medium, else low.
          severity=low
          grep -q '🔴' /tmp/sentry.txt && severity=critical || true
          [ "$severity" != "critical" ] && grep -q '🟡' /tmp/sentry.txt && severity=medium || true

          jq -n \
            --arg title "Haftalık production-health — $(date +%Y-%m-%d)" \
            --arg sev "$severity" \
            --rawfile body /tmp/sentry.txt \
            --arg src "weekly-health" \
            '{title: $title, severity: $sev, body: $body, source: $src}' \
            | node scripts/notify-finding.cjs
