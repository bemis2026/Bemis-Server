# Claude Code GitHub Action
#
# Triggers when someone writes "@claude <task>" in an issue / PR body
# or comment. Claude opens a sandbox, reads the repo, runs the task
# (edit files, run tests, build, push a branch, comment back) and
# disappears. Useful when you're away from your desk and want a small
# fix or review done without spinning up a terminal.
#
# Examples:
#   @claude can you review this PR?
#   @claude fix the typo in app/bayilik/page.tsx hero
#   @claude bump the year in the footer copyright
#
# The action reads ANTHROPIC_API_KEY from repo secrets (set once in
# Settings → Secrets and variables → Actions) and bills against your
# Anthropic account.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Run only when someone tags @claude — avoids burning credits on
    # routine bot comments / random activity.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # ⚠️ 2026-05-11'de bu iş 3 kez denendi, ÜÇÜ DE 429 ile başarısız oldu:
          #   "would exceed your organization's rate limit of 10,000 input
          #    tokens per minute (model: claude-opus-4-7)"
          # Anahtar GEÇERLİ ve faturalama çalışıyor (denemede 0,19 $ işlendi) —
          # sorun Anthropic API hesabının DAKİKALIK limit kademesinin düşük
          # olması. Claude Code'un istemi tek istekte 10k girdi jetonunu aşıyor.
          #
          # Repo tarafından yapılabilecek tek şey model kademesini düşürmek:
          # hız limitleri model sınıfı başına ayrı tutulur, Sonnet'in payı
          # Opus'tan yüksektir. Tur sayısı da maliyeti sınırlamak için kapalı.
          # ⚠️ Bu tek başına YETMEYEBİLİR — kalıcı çözüm console.anthropic.com'da
          # bakiye ekleyip kullanım kademesini yükseltmek.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10
