# Daily lightweight monitors.
#
# Two cheap checks that don't need Claude — just plain Node:
#   1. Form spam   — Vercel Blob messages bin, count last 24h
#   2. SSL expiry  — certificate <14 days from expiry → issue
#
# (Eski "bin size" kontrolü kaldırıldı — veri Vercel Blob'a taşındı, 100KB
#  kayıt limiti yok.)
#
# notify-finding.cjs ortak bildirim kanalı (GitHub Issue + e-posta).

name: Daily monitors

on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 Europe/Istanbul
  workflow_dispatch:

jobs:
  monitors:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install deps
        run: npm ci

      - name: Form spam + SSL
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:  ${{ secrets.RESEND_FROM_EMAIL }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
        run: |
          node scripts/daily-monitors.cjs
